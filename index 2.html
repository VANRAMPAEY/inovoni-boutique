<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1219"><title>INOVONI — Le futur aujourd'hui</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d1219;color:#fff;font-family:Arial,Helvetica,sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:12px}.scene{width:min(100%,calc(100svh * 1.25));aspect-ratio:5/4;position:relative;overflow:hidden;background:#0d1219}video,.hall{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.hall{display:block}video{z-index:2;transition:opacity .65s ease}body.done video{opacity:0;pointer-events:none}.hotspot{position:absolute;z-index:3;top:13%;width:22%;height:26%;border-radius:50%;display:none;align-items:center;justify-content:center;text-decoration:none;color:transparent;outline-offset:3px}body.done .hotspot{display:flex}.cible{left:1.5%}.visite{right:1.5%}.hotspot:focus-visible{outline:3px solid #fff}.skip{position:fixed;z-index:5;right:16px;top:calc(16px + env(safe-area-inset-top));border:1px solid #d6c8ad;border-radius:28px;background:rgba(12,16,23,.8);color:#fff;padding:12px 18px;font-size:15px;cursor:pointer}body.done .skip{display:none}.panel{position:fixed;z-index:7;inset:auto 14px 16px;background:#111c2b;border:1px solid #e0bf78;border-radius:14px;padding:20px;text-align:center;display:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}.panel:target{display:block}.panel a{color:#f2d69a}.panel h2{margin-top:0}
</style></head><body><button class="skip" id="skip" type="button">Passer l’introduction →</button><main><div class="scene"><img class="hall" src="INOVONI_hall_final.png" alt="Grand hall INOVONI avec les espaces CIBLE et VISITE"><video id="intro" autoplay muted playsinline preload="auto" aria-label="Introduction INOVONI"><source src="INOVONI_intro.mp4" type="video/mp4"></video><a class="hotspot cible" href="#cible" aria-label="Entrer dans CIBLE">CIBLE</a><a class="hotspot visite" href="#visite" aria-label="Entrer dans VISITE">VISITE</a></div></main><section class="panel" id="cible"><h2>CIBLE</h2><p>La sélection INOVONI sera bientôt accessible ici.</p><a href="#">Retour au hall</a></section><section class="panel" id="visite"><h2>VISITE</h2><p>La visite INOVONI sera bientôt accessible ici.</p><a href="#">Retour au hall</a></section><script>
const video=document.getElementById('intro');let finished=false;function showHall(){if(finished)return;finished=true;document.body.classList.add('done');video.pause();}document.getElementById('skip').addEventListener('click',showHall);video.addEventListener('ended',showHall);video.addEventListener('error',showHall);video.play().catch(()=>{document.getElementById('skip').textContent='Entrer dans INOVONI →'});</script></body></html>
