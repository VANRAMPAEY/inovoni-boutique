<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INOVONI — Le futur aujourd’hui</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1017;font-family:Arial,sans-serif}button{cursor:pointer}#stage{position:relative;width:100vw;height:100dvh;overflow:hidden}#hall{position:absolute;inset:0;background:#151014 url('accueil.png') center/contain no-repeat;opacity:1}#hall:before{content:'';position:absolute;inset:0;background:url('accueil.png') center/cover no-repeat;filter:blur(26px);opacity:.35;z-index:-1}.orb{position:absolute;border:0;background:transparent;border-radius:50%;z-index:3;touch-action:manipulation;animation:beat 2.5s infinite}.orb.left{left:4%;top:10%;width:14%;height:22%}.orb.right{right:4%;top:10%;width:14%;height:22%}@keyframes beat{0%,26%,48%,100%{transform:scale(1)}12%{transform:scale(1.09)}37%{transform:scale(1.055)}}#doorstage{position:absolute;inset:0;z-index:8;overflow:hidden;transition:opacity 1.3s ease;background:#c6ad8d}#doorstage.fade{opacity:0;pointer-events:none}.doorart{position:absolute;width:var(--dw);height:var(--dh);left:50%;top:50%;transform:translate(-50%,-50%);background-size:100% 100%;background-repeat:no-repeat;pointer-events:none}#pane{background-image:url('porte_mobile.png');z-index:1;will-change:transform}#pane.open{transform:translate(calc(-50% - var(--dw) * .96),-50%);transition:transform 3.1s cubic-bezier(.45,0,.55,1)}#frame{background-image:url('cadre_fixe.png');z-index:2}#explorer{position:absolute;inset:0;z-index:12;background:#050814;clip-path:circle(0% at 79% 20%);opacity:0;pointer-events:none;transition:clip-path 1.8s ease,opacity 1.3s ease}#explorer.open{clip-path:circle(160% at 79% 20%);opacity:1;pointer-events:auto}#explorer video{width:100%;height:100%;object-fit:contain}#back{position:absolute;top:20px;left:16px;color:white;background:#111b2ddd;border:1px solid #ad9368;border-radius:24px;padding:12px 18px}#notice{display:none;position:absolute;z-index:15;bottom:9%;left:50%;transform:translateX(-50%);background:#10192aee;border:1px solid #bba26d;border-radius:14px;color:white;padding:18px;text-align:center;white-space:nowrap}#skip{position:absolute;right:18px;bottom:18px;z-index:10;color:white;background:#18121bcc;border:1px solid #c3a46c;border-radius:22px;padding:11px 15px}#skip.hide{display:none}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style></head><body><main id="stage"><section id="hall" aria-label="Accueil INOVONI"><button id="cibler" class="orb left" aria-label="CIBLER en construction"></button><button id="go" class="orb right" aria-label="EXPLORER"></button></section><section id="doorstage" aria-label="Porte originale INOVONI"><div id="pane" class="doorart"></div><div id="frame" class="doorart"></div></section><button id="skip">Passer l’introduction</button><section id="explorer" aria-label="EXPLORER"><video id="cosmos" src="explorer.mp4" muted playsinline loop preload="metadata"></video><button id="back">← Accueil</button></section><div id="notice" role="status">CIBLER — En attente de construction</div></main><script>
const stage=document.getElementById('stage'),doorstage=document.getElementById('doorstage'),pane=document.getElementById('pane'),skip=document.getElementById('skip'),ex=document.getElementById('explorer'),cosmos=document.getElementById('cosmos'),notice=document.getElementById('notice');const timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function layout(){const w=innerWidth,h=innerHeight,ratio=1145/1374,dw=Math.max(w,h*ratio),dh=dw/ratio;stage.style.setProperty('--dw',dw+'px');stage.style.setProperty('--dh',dh+'px');const hallW=Math.min(w,h*1672/941),hallH=hallW*941/1672;for(const [id,x] of [['cibler',.125],['go',.875]]){let b=document.getElementById(id);b.style.left=((w-hallW)/2+hallW*x-hallW*.08)+'px';b.style.top=((h-hallH)/2+hallH*.10)+'px';b.style.width=(hallW*.16)+'px';b.style.height=(hallH*.22)+'px';b.style.right='auto'}}addEventListener('resize',layout);layout();function reveal(){doorstage.classList.add('fade');skip.classList.add('hide');later(()=>doorstage.style.display='none',1400)}later(()=>pane.classList.add('open'),1600);later(reveal,5900);skip.onclick=()=>{timers.forEach(clearTimeout);reveal()};document.getElementById('cibler').onclick=()=>{notice.style.display='block';setTimeout(()=>notice.style.display='none',2500)};document.getElementById('go').onclick=()=>{const b=document.getElementById('go').getBoundingClientRect();const x=b.left+b.width/2,y=b.top+b.height/2;ex.style.clipPath=`circle(0% at ${x}px ${y}px)`;ex.classList.add('open');requestAnimationFrame(()=>{ex.style.clipPath=`circle(160% at ${x}px ${y}px)`});cosmos.play().catch(()=>{})};document.getElementById('back').onclick=()=>{ex.classList.remove('open');ex.style.clipPath='';cosmos.pause()};
</script></body></html>
